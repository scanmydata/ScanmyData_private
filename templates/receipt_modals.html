{#
This partial provides two modals related to receipt analysis.
They are wrapped in a <template> so that search.html can clone them
only when the user has enabled receipt analysis.
#}
<template id="rc-receipt-modals-template">

<!-- RECEIPT CLASSIFICATION MODAL -->
<div id="receiptClassModal" class="fixed inset-0 flex items-center justify-center bg-black/40 z-50 p-4" style="display:none;">
  <div class="rm-dialog" role="dialog" aria-modal="true" aria-labelledby="receiptClassTitle">
    <div class="rm-head">
      <div class="rm-ico">🧾</div>
      <div class="rm-headtext">
        <h3 id="receiptClassTitle" class="rm-title">Χαρακτηρισμός αποδείξεων ανά ΦΠΑ</h3>
        <div class="rm-sub">Επιλέξτε για κάθε ποσοστό ΦΠΑ ποια κατηγορία θα χρησιμοποιείται για τις αποδείξεις.</div>
      </div>
      <button id="receiptClassCloseX" class="rm-x" type="button" aria-label="Κλείσιμο">✕</button>
    </div>

    <div class="rm-body">
      <!-- Profile selector (receipts) -->
      <div class="rm-section-t" style="margin-top:0;">Προφίλ</div>
      <div class="rm-profile">
        <select id="charProfileSelectClass" aria-label="Προφίλ χαρακτηρισμών αποδείξεων"></select>
        <a data-profiles-link="true" href="{{ url_for('profiles_page', vat=vat, mode='receipts', return_to='receipt_class') }}" class="rm-plus" title="Δημιουργία / διαχείριση προφίλ" aria-label="Δημιουργία / διαχείριση προφίλ">+</a>
      </div>

      <div class="rm-section-t">Κατηγορία ανά ΦΠΑ</div>
      <div id="receiptClassList"></div>
    </div>

    <div class="rm-foot">
      <button id="receiptClassCancel" class="rm-btn" type="button">Άκυρο</button>
      <button id="receiptClassSave" class="rm-btn rm-btn-primary" type="button">Αποθήκευση</button>
    </div>
  </div>
</div>


<!-- RECEIPT REPEAT MAPPING MODAL -->
<div id="receiptRepeatMappingModal" class="fixed inset-0 flex items-center justify-center bg-black/40 z-50 p-4" style="display:none;">
  <div class="rm-dialog" role="dialog" aria-modal="true" aria-labelledby="receiptRepeatTitle">
    <div class="rm-head">
      <div class="rm-ico">🔁</div>
      <div class="rm-headtext">
        <h3 id="receiptRepeatTitle" class="rm-title">Επαναληπτική αντιστοίχιση για αποδείξεις</h3>
        <div class="rm-sub">Επιλέξτε για κάθε συντελεστή ΦΠΑ την κατηγορία που θα εφαρμόζεται αυτόματα στις αποδείξεις.</div>
      </div>
      <button id="receiptRepeatModalCloseX" class="rm-x" type="button" aria-label="Κλείσιμο">✕</button>
    </div>

    <div class="rm-body">
      <!-- Επιλογή Προφίλ (ακριβώς όπως στο invoice modal) -->
      <div class="rm-section-t" style="margin-top:0;">Προφίλ</div>
      <div class="rm-profile">
        <select id="charProfileSelectReceipt" aria-label="Προφίλ χαρακτηρισμών αποδείξεων"></select>
        <a data-profiles-link="true" href="{{ url_for('profiles_page', vat=vat, mode='receipts') }}" class="rm-plus" title="Δημιουργία / διαχείριση προφίλ" aria-label="Δημιουργία / διαχείριση προφίλ">+</a>
      </div>

      <div id="charMissingHintReceipt" class="rm-hint-err" style="display:none"></div>

      <div class="rm-section-t">Κατηγορία ανά ΦΠΑ</div>
      <div id="receiptRepeatMappingList"></div>

      <!-- MTYPE dropdowns for Γ Κατηγορία -->
      <div id="repeatReceiptMtypeContainer" style="display:none;">
        <label for="repeatReceiptMtypeSelect">Είδος Κίνησης για Αποδείξεις (Γ Κατηγορία) <span>*</span></label>
        <select id="repeatReceiptMtypeSelect" required>
          <option value="">-- επιλέξτε είδος κίνησης --</option>
        </select>
      </div>
    </div>

    <div class="rm-foot">
      <button id="receiptRepeatModalCancel" class="rm-btn" type="button">Άκυρο</button>
      <button id="receiptRepeatModalSave" class="rm-btn rm-btn-primary" type="button">Αποθήκευση</button>
    </div>
  </div>
</div>

</template>

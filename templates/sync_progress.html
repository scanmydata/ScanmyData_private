{% extends 'base.html' %}

{% block title %}Syncing...{% endblock %}

{% block content %}
<div class="container">
  <div class="content-wrap text-center">
    <h2 id="syncTitle">Συγχρονισμός δεδομένων</h2>
    <p id="syncDesc">Παρακαλώ περιμένετε — γίνεται συγχρονισμός με το cloud. Μη κλείσετε το παράθυρο.</p>

    <div class="progress" style="height: 24px; margin: 18px 0;">
      <div id="syncBar" class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width: 0%">0%</div>
    </div>

    <div id="syncStatus" style="margin-top:12px; color:#555">Αρχικοποίηση...</div>

    <div style="margin-top:18px">
      <button id="syncCancel" class="btn btn-secondary">Ακύρωση</button>
    </div>
  </div>
</div>

<script>
$(function(){
  const action = '{{ action }}';
  const group = '{{ group }}';
  const csrf = '';
  let aborted = false;

  function setProgress(p, text){
    $('#syncBar').css('width', p+'%').text(p+'%');
    if(text) $('#syncStatus').text(text);
  }

  $('#syncCancel').on('click', function(){
    aborted = true;
    if(typeof stopPolling === 'function'){ stopPolling(); }
    $('#syncStatus').text('Ακύρωση...');
    setProgress(0,'Ακύρωση από χρήστη');
    setTimeout(function(){ window.location = '/'; }, 800);
  });

  let pollTimer = null;
  function stopPolling(){ if(pollTimer){ clearInterval(pollTimer); pollTimer = null; } }

  function finish(success){
    stopPolling();
    if(success){
      setProgress(100, 'Ο συγχρονισμός ολοκληρώθηκε. Ανακατεύθυνση...');
      setTimeout(function(){ window.location = '/'; }, 700);
    } else {
      setProgress(0, 'Σφάλμα κατά το συγχρονισμό. Δοκιμάστε ξανά.');
    }
  }

  // Poll the server for *real* progress written by the Drive pull, so the bar
  // reflects actual download status instead of a fixed fake value.
  function startPolling(){
    stopPolling();
    pollTimer = setInterval(function(){
      $.ajax({
        url: '/api/sync_progress',
        method: 'GET',
        cache: false,
        success: function(s){
          if(aborted || !s) return;
          if(typeof s.percent === 'number' && s.percent > 0){
            // Keep the bar in the 5–99% band until the POST confirms completion.
            setProgress(Math.min(99, Math.max(5, s.percent)), s.message || undefined);
          }
          if(s.status === 'done'){ finish(true); }
          else if(s.status === 'error'){ finish(false); }
        }
      });
    }, 1000);
  }

  if(action === 'pull'){
    setProgress(5, 'Επικοινωνία με cloud...');
    startPolling();
    $.ajax({
      url: '{{ url_for("firebase_auth.api_sync_pull") }}',
      method: 'POST',
      contentType: 'application/json',
      data: JSON.stringify({group: group}),
      success: function(resp){
        if(resp && resp.success){
          finish(true);
        } else {
          finish(false);
        }
      },
      error: function(){ finish(false); }
    });
  }
  else if(action === 'push'){
    setProgress(5, 'Συλλογή αρχείων...');
    $.ajax({
      url: '{{ url_for("firebase_auth.api_sync_push") }}',
      method: 'POST',
      contentType: 'application/json',
      data: JSON.stringify({group: group, logout_after: true}),
      success: function(resp){
        if(resp && resp.success){
          setProgress(90, 'Αποστολή στο cloud...');
          setTimeout(function(){ finish(true); }, 600);
        } else {
          finish(false);
        }
      },
      error: function(){ finish(false); }
    });
  }
});
</script>

{% endblock %}

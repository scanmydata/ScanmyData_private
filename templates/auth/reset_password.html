{% extends "base.html" %}

{% block title %}Νέος κωδικός - ScanmyData{% endblock %}

{% block content %}
{% include 'partials/auth_ui_css.html' %}
<div class="au au-narrow">
  <section class="au-card">
    <div class="au-head">
      <div class="au-ico-lg">🔑</div>
      <h1 class="au-title">Ορισμός νέου κωδικού</h1>
      <div class="au-lead">Επιλέξτε έναν νέο κωδικό για τον λογαριασμό σας.</div>
    </div>

    <form method="POST" class="au-form">
      <div>
        <label class="au-label" for="password">Νέος κωδικός</label>
        <div class="au-input-wrap">
          <span class="au-input-ico" aria-hidden="true">🔑</span>
          <input type="password" class="au-input" id="password" name="password" required minlength="6" autocomplete="new-password" autofocus placeholder="Τουλάχιστον 6 χαρακτήρες">
        </div>
      </div>
      <div>
        <label class="au-label" for="password_confirm">Επιβεβαίωση κωδικού</label>
        <div class="au-input-wrap">
          <span class="au-input-ico" aria-hidden="true">🔒</span>
          <input type="password" class="au-input" id="password_confirm" name="password_confirm" required minlength="6" autocomplete="new-password" placeholder="Ξαναγράψτε τον κωδικό">
        </div>
      </div>
      <button type="submit" class="au-submit">Αποθήκευση νέου κωδικού →</button>
    </form>

    <div class="au-sep"></div>
    <div class="au-alt"><a class="au-link" href="{{ url_for('auth.login') }}">← Επιστροφή στη σύνδεση</a></div>
  </section>
</div>
{% endblock %}
